[package]
name = "achlys"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
libafl = { workspace = true }
libafl_bolts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
achlys-core = { path = "src/core" }
achlys-bridge = { path = "src/bridge" }
achlys-protocol = { path = "src/protocol" }

[build-dependencies]
cc = { workspace = true }

[[example]]
name = "cjson_blackbox"
path = "examples/fuzzers/cjson_blackbox_fuzzer.rs"

[[example]]
name = "cjson_graybox"
path = "examples/fuzzers/cjson_graybox_fuzzer.rs"

[[example]]
name = "libafl_baseline"
path = "examples/fuzzers/libafl_baseline.rs"

[[example]]
name = "achlys_h0"
path = "examples/fuzzers/achlys_h0.rs"

[[example]]
name = "achlys_oracle"
path = "examples/fuzzers/achlys_oracle.rs"

[[example]]
name = "achlys_t1"
path = "examples/fuzzers/achlys_t1.rs"

[workspace]
members = [
    "src/protocol",
    "src/core",
    "src/cortex",
    "src/bridge",
    "src/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Dadaam"]
license = "MIT"
repository = "https://github.com/Dadaam/achlys"


[workspace.dependencies]
# Fuzzing
libafl = "0.15.4"
libafl_bolts = "0.15.4"

# ML
ort = "2.0.0-rc.11"

# Utils
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
mimalloc = { version = "0.1", features = [] }

# Build 
cc = "1.2"
