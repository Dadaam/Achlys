name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: H0 functional smoke
        run: H0_FUNCTIONAL=1 ./scripts/experiments/h0_throughput.sh

      - name: T1 manifest campaign smoke
        run: T1_FUNCTIONAL=1 ./scripts/experiments/t1_smoke.sh

      - name: T2 homogeneous smoke
        run: T2_FUNCTIONAL=1 ./scripts/experiments/t2_smoke.sh
